<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Balance de Gastos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Aptos", Arial, sans-serif;
      margin: 0; padding: 20px;
      background: url('mifondo3.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: #262626;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      text-align: center;
      color: #e0e0e0;
    }

    h1 { color: #ff5252; }

    input {
      font-family: "Aptos", Arial, sans-serif;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: #fff;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    input::placeholder { color: #888; }

    button {
      background: #1976d2; border: none; cursor: pointer;
      font-size: 14px; color: white; width: 100px;
      height: 36px; border-radius: 4px; padding: 0;
      line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; margin: 6px;
      transition: 0.3s;
    }
    button:hover { background: #0d47a1; }

    #btn-compartir {
      background: #25d366;
      width: auto;
      padding: 0 20px;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 15px;
      color: #fff;
    }
    #btn-compartir:hover { background: #128c7e; }

    .switch {
      position: relative; display: inline-block;
      width: 50px; height: 24px; vertical-align: middle;
    }
    .switch input { display: none; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444; transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #1976d2; }
    input:checked + .slider:before { transform: translateX(26px); }

    #resultados {
      margin-top: 20px; padding: 15px;
      background: #1e1e1e; border-radius: 8px; text-align: left;
      color: #e0e0e0;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #e0e0e0; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; color: #e0e0e0; }
    td:last-child { text-align: right; }

    .delete-btn {
      background: #f44336; border: none; cursor: pointer;
      font-size: 18px; color: white; width: 32px; height: 32px;
      border-radius: 4px; padding: 0; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .delete-btn:hover { background: #d32f2f; }

    .resumen-saldos {
      margin-top: 20px; padding: 15px; background: #1a2e1b;
      border-radius: 8px; border-left: 4px solid #4caf50; color: #e0e0e0;
    }
    .resumen-saldos h3 { color: #81c784; margin-top: 0; margin-bottom: 15px; }
    .saldo-item {
      margin-bottom: 15px; padding: 12px; background: #223825;
      border-radius: 6px; border-left: 3px solid #4caf50;
    }
    .saldo-persona { font-weight: bold; color: #64b5f6; margin-bottom: 12px; font-size: 16px; }
    .saldo-desglose { font-size: 13px; color: #ccc; line-height: 1.8; margin-bottom: 12px; background: #1e1e1e; padding: 10px; border-radius: 4px; }
    .saldo-desglose div { display: flex; justify-content: space-between; align-items: center; }
    .saldo-linea { border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 8px; }
    .saldo-operacion {
      background: #1e1e1e; padding: 10px; border-radius: 4px;
      font-family: monospace; text-align: center; font-size: 13px;
      color: #fff; font-weight: bold; margin: 10px 0; border: 1px solid #2e7d32;
    }
    .saldo-resultado {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 2px solid #4caf50; font-weight: bold; font-size: 14px;
      color: #e0e0e0;
    }
    .saldo-negativo { color: #ef5350; }
    .transf-item-paga { color: #ef5350; font-weight: bold; }
    .transf-item-recibe { color: #81c784; font-weight: bold; }
    .validacion-ok { text-align: center; font-weight: bold; color: #81c784; margin-top: 15px; padding: 10px; background: #1a2e1b; border-radius: 6px; }

    footer#teamName {
      text-align: center;
      margin-top: 30px;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      color: #6a1b9a;
      letter-spacing: 2px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Balance de Gastos</h1>

    <input type="text" id="nombre" placeholder="Nombre">
    <input type="number" id="pago" placeholder="Gasto realizado (ej: 1000)">
    <button onclick="agregarPersona()">Agregar</button>

    <div style="margin-top:15px;">
      <label for="decimales">Decimales:</label>
      <label class="switch">
        <input type="checkbox" id="decimales">
        <span class="slider"></span>
      </label>
    </div>

    <div id="lista"></div>

    <button onclick="calcularBalance()">Calcular</button>
    <div>
      <button onclick="limpiarTodo()">Limpiar datos</button>
    </div>

    <div id="resultados"></div>
  </div>

  <footer id="teamName">Dark Passenger</footer>

  <script>
    let personas = [];
    let textoParaCompartir = "";

    function agregarPersona() {
      const nombre = document.getElementById("nombre").value.trim();
      const pago = Math.abs(parseFloat(document.getElementById("pago").value)) || 0;
      
      if (!nombre) return alert("Escribe un nombre");

      personas.push({ nombre, pago });
      mostrarLista();
      document.getElementById("nombre").value = "";
      document.getElementById("pago").value = "";
    }

    function mostrarLista() {
      const listaDiv = document.getElementById("lista");
      if (personas.length === 0) {
        listaDiv.innerHTML = "";
        return;
      }
      let tabla = "<table><tr><th>Nombre</th><th>Gasto</th><th></th></tr>";
      personas.forEach((p, index) => {
        tabla += `
          <tr>
            <td>👤 ${p.nombre.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</td>
            <td>${formatearNumero(p.pago)}</td>
            <td><button class="delete-btn" onclick="eliminarPersona(${index})">🗑️</button></td>
          </tr>`;
      });
      tabla += "</table>";
      listaDiv.innerHTML = tabla;
    }

    function eliminarPersona(index) {
      personas.splice(index, 1);
      mostrarLista();
      document.getElementById("resultados").innerHTML = "";
    }

    function calcularBalance() {
      if (personas.length === 0) return alert("Agrega al menos una persona");

      const total = personas.reduce((sum, p) => sum + p.pago, 0);
      const promedio = total / personas.length;

      let deudores = [];
      let acreedores = [];
      let transferencias = [];

      personas.forEach(p => {
        const diferencia = p.pago - promedio;
        if (diferencia < -0.01) {
          deudores.push({ nombre: p.nombre, debe: -diferencia });
        } else if (diferencia > 0.01) {
          acreedores.push({ nombre: p.nombre, recibe: diferencia });
        }
      });

      let resultados = "<h3>Instrucciones de Pago:</h3>";
      let i = 0, j = 0;
      
      while (i < deudores.length && j < acreedores.length) {
        let deuda = deudores[i].debe;
        let credito = acreedores[j].recibe;

        if (deuda > 0 && credito > 0) {
          const monto = Math.min(deuda, credito);
          resultados += `➡️ <strong>${deudores[i].nombre}</strong> debe dar ${formatearNumero(monto)} a <strong>${acreedores[j].nombre}</strong><br>`;
          
          transferencias.push({
            de: deudores[i].nombre,
            hacia: acreedores[j].nombre,
            monto: monto
          });
          
          deudores[i].debe -= monto;
          acreedores[j].recibe -= monto;
        }

        if (deudores[i].debe < 0.01) i++;
        if (acreedores[j].recibe < 0.01) j++;
      }

      if (transferencias.length === 0) {
        resultados += "Todos aportaron lo mismo. Nadie debe nada a nadie.<br>";
      }

      resultados += `<br><strong>Total gastado en grupo:</strong> ${formatearNumero(total)}`;
      
      resultados += crearResumenSaldos(transferencias, promedio);

      // --- CONSTRUCCIÓN DEL TEXTO PARA COMPARTIR ---
      textoParaCompartir = `📊 *Balance de Gastos*\n\n`;
      textoParaCompartir += `💰 *Total gastado:* ${formatearNumero(total)}\n`;
      textoParaCompartir += `🎯 *Cuota por persona:* ${formatearNumero(promedio)}\n\n`;
      
      textoParaCompartir += `📝 *Cuanto puso cada uno al inicio:*\n`;
      personas.forEach(p => {
        textoParaCompartir += `👤 ${p.nombre}: ${formatearNumero(p.pago)}\n`;
      });
      
      textoParaCompartir += `\n💸 *Transferencias:*\n`;
      if (transferencias.length > 0) {
        transferencias.forEach(t => {
          textoParaCompartir += `➡️ ${t.de} debe dar ${formatearNumero(t.monto)} a ${t.hacia}\n`;
        });
      } else {
        textoParaCompartir += `✅ Todos aportaron lo mismo. Nadie debe nada.\n`;
      }

      textoParaCompartir += `\n*⚖️ Gasto detallado:*\n`;
      personas.forEach(p => {
        let saldoNeto = -p.pago;
        let operacion = `-${formatearNumero(p.pago)}`;
        transferencias.forEach(t => {
          if (t.de === p.nombre) {
            saldoNeto -= t.monto;
            operacion += ` - ${formatearNumero(t.monto)}`;
          } else if (t.hacia === p.nombre) {
            saldoNeto += t.monto;
            operacion += ` + ${formatearNumero(t.monto)}`;
          }
        });
        textoParaCompartir += `👤 ${p.nombre}:\n  Desglose: ${operacion}\n  Gasto final: ${formatearNumero(saldoNeto)}\n\n`;
      });

      textoParaCompartir += `✨ Hecho con: https://darkpassengerpy.github.io/tools/`;

      let botonCopiar = `<div style="text-align: center;"><button id="btn-compartir" onclick="compartirDatos()">Copiar calculos 📋</button></div>`;
      
      document.getElementById("resultados").innerHTML = botonCopiar + resultados;
    }

    function compartirDatos() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(textoParaCompartir).then(() => {
          const btn = document.getElementById("btn-compartir");
          btn.innerHTML = "¡Copiado! ✅";
          btn.style.background = "#1b5e20";
          
          setTimeout(() => {
            btn.innerHTML = "Copiar calculos 📋";
            btn.style.background = "#25d366";
          }, 2000);
        }).catch(err => {
          alert("Error al copiar. Tu navegador podría estar bloqueándolo.");
        });
      } else {
        alert("Tu navegador no soporta el copiado automático.");
      }
    }

    function crearResumenSaldos(transferencias, promedio) {
      let html = '<div class="resumen-saldos"><h3>⚖️ Gasto detallado:</h3>';

      personas.forEach(p => {
        let saldoNeto = -p.pago; 
        let operacion = `-${formatearNumero(p.pago)}`;
        let desglose = `<div class="saldo-desglose">`;

        desglose += `<div class="saldo-linea"><span>Gasto inicial:</span> <span class="transf-item-paga">-${formatearNumero(p.pago)}</span></div>`;

        transferencias.forEach(t => {
          if (t.de === p.nombre) {
            desglose += `<div><span>Paga a ${t.hacia}:</span> <span class="transf-item-paga">-${formatearNumero(t.monto)}</span></div>`;
            saldoNeto -= t.monto;
            operacion += ` - ${formatearNumero(t.monto)}`;
          } else if (t.hacia === p.nombre) {
            desglose += `<div><span>Recibe de ${t.de}:</span> <span class="transf-item-recibe">+${formatearNumero(t.monto)}</span></div>`;
            saldoNeto += t.monto;
            operacion += ` + ${formatearNumero(t.monto)}`;
          }
        });

        desglose += `</div>`;

        html += `
          <div class="saldo-item">
            <div class="saldo-persona">👤 ${p.nombre}</div>
            ${desglose}
            <div class="saldo-operacion">
              ${operacion} = <span class="saldo-negativo">${formatearNumero(saldoNeto)}</span>
            </div>
            <div class="saldo-resultado">
              <span>Gasto final:</span>
              <span class="saldo-negativo">${formatearNumero(saldoNeto)}</span>
            </div>
          </div>`;
      });

      html += `<div class="validacion-ok">✅ ¡Cálculo perfecto! Todos terminan con un gasto real de -${formatearNumero(promedio)} (que es la cuota por persona).</div>`;
      html += '</div>';
      return html;
    }

    function limpiarTodo() {
      personas = [];
      document.getElementById("lista").innerHTML = "";
      document.getElementById("resultados").innerHTML = "";
      document.getElementById("nombre").value = "";
      document.getElementById("pago").value = "";
    }

    function formatearNumero(num) {
      const usarDecimales = document.getElementById("decimales").checked;
      const opciones = {
        minimumFractionDigits: usarDecimales ? 2 : 0,
        maximumFractionDigits: usarDecimales ? 2 : 0
      };
      return new Intl.NumberFormat("es-ES", opciones).format(num);
    }
  </script>
</body>
</html>
