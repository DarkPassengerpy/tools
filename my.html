<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Compras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Aptos", Arial, sans-serif;
      margin: 0; 
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-sizing: border-box;
      text-align: left;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }

    header { 
      text-align: center; 
      margin-bottom: 15px; 
    }

    h1 { 
      font-size: 22px; 
      margin: 0 0 8px 0; 
      text-align: center;
    }

    #contador { 
      font-weight: bold; 
      font-size: 14px; 
      margin-bottom: 10px; 
      text-align: center;
    }

    h2 { 
      margin-top: 20px; 
      font-size: 16px; 
      border-bottom: 1px solid;
      padding-bottom: 5px;
    }

    input, select {
      font-family: "Aptos", Arial, sans-serif;
      width: 100%; 
      padding: 10px; 
      margin: 6px 0;
      font-size: 14px; 
      border-radius: 6px; 
      box-sizing: border-box;
      text-align: center;
      outline: none;
      transition: background 0.3s, border 0.3s, color 0.3s;
    }

    button {
      font-family: "Aptos", Arial, sans-serif;
      width: 100%; 
      padding: 10px; 
      margin: 6px 0;
      font-size: 14px; 
      border-radius: 6px; 
      box-sizing: border-box;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }

    #btnAgregar { 
      background: #1976d2; 
      color: white; 
    }
    #btnAgregar:hover { 
      background: #0d47a1; 
    }

    #btnLimpiar { 
      background: #d32f2f; 
      color: white; 
    }
    #btnLimpiar:hover { 
      background: #b71c1c; 
    }

    #toggleTheme {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
      height: auto;
      margin-top: 5px;
    }

    ul { 
      list-style: none; 
      padding: 0; 
      margin-top: 5px; 
    }

    li {
      display: flex; 
      align-items: center; 
      gap: 10px;
      padding: 10px 12px; 
      margin-bottom: 8px; 
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.3s, border 0.3s, color 0.3s;
    }

    input[type=checkbox] { 
      width: 20px; 
      height: 20px; 
      cursor: pointer;
      accent-color: #1976d2;
    }

    li span { flex: 1; word-break: break-word; }
    .checked span { text-decoration: line-through; color: #888; }

    .delete-btn {
      width: 28px; 
      height: 28px;
      background: #f44336; 
      color: white;
      border: none; 
      border-radius: 4px;
      cursor: pointer; 
      font-size: 14px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 0; 
      line-height: 1;
      flex-shrink: 0;
    }
    .delete-btn:hover { background: #d32f2f; }

    /* --- TEMA CLARO (Por defecto) --- */
    body.light {
      background: #f5f5f5;
      color: #333;
    }
    body.light .container {
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      color: #333;
    }
    body.light h1 {
      color: #1976d2;
    }
    body.light h2 {
      color: #1976d2;
      border-bottom-color: #eee;
    }
    body.light input, body.light select {
      background: #f9f9f9;
      border: 1px solid #ccc;
      color: #333;
    }
    body.light li {
      background: #f9f9f9;
      border: 1px solid #ddd;
      color: #333;
    }
    body.light #toggleTheme {
      background: #e0e0e0;
      color: #333;
    }
    body.light #toggleTheme:hover {
      background: #d0d0d0;
    }

    /* --- TEMA OSCURO --- */
    body.dark {
      background: #121212;
      color: #e0e0e0;
    }
    body.dark .container {
      background: #262626;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      color: #e0e0e0;
    }
    body.dark h1 {
      color: #ff5252;
    }
    body.dark h2 {
      color: #81c784;
      border-bottom-color: #444;
    }
    body.dark input, body.dark select {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #fff;
    }
    body.dark li {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #e0e0e0;
    }
    body.dark #toggleTheme {
      background: #333;
      color: #fff;
    }
    body.dark #toggleTheme:hover {
      background: #444;
    }

    footer#teamName {
      text-align: center;
      margin-top: 30px;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      color: #6a1b9a;
      letter-spacing: 2px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.8);
    }
  </style>
</head>
<body class="light">
  <div class="container">
    <header>
      <h1>🛒 Mi Lista de Compras</h1>
      <div id="contador">Pendientes: 0/0</div>
      <button id="toggleTheme">🌙 Tema Oscuro</button>
    </header>

    <input type="text" id="nuevoProducto" placeholder="Escribe un producto">
    <select id="categoria">
      <option value="GVO">GVO</option>
      <option value="Casa">Casa</option>
    </select>
    <button id="btnAgregar">Agregar</button>
    <button id="btnLimpiar">Limpiar lista</button>

    <h2>GVO</h2>
    <ul id="listaGVO"></ul>

    <h2>Casa</h2>
    <ul id="listaCasa"></ul>
  </div>

  <footer id="teamName">Dark Passenger</footer>

  <script>
    const listaGVO = document.getElementById("listaGVO");
    const listaCasa = document.getElementById("listaCasa");
    const contador = document.getElementById("contador");
    const toggleBtn = document.getElementById("toggleTheme");

    const productosFijos = [
      { texto: "Yogurth", categoria: "GVO" },
      { texto: "Galletitas", categoria: "GVO" },
      { texto: "Alfajores / barritas", categoria: "GVO" },
      { texto: "Leche", categoria: "Casa" },
      { texto: "Picadillo", categoria: "Casa" }
    ];

    function crearItem(texto, categoria, marcado=false) {
      const li = document.createElement("li");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = marcado;
      checkbox.addEventListener("change", () => {
        li.classList.toggle("checked", checkbox.checked);
        guardarEstado();
      });
      li.appendChild(checkbox);

      const span = document.createElement("span");
      span.textContent = texto;
      li.appendChild(span);

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "🗑️";
      deleteBtn.className = "delete-btn";
      deleteBtn.onclick = () => {
        li.remove();
        guardarEstado();
      };
      li.appendChild(deleteBtn);

      if (marcado) li.classList.add("checked");
      if (categoria === "GVO") listaGVO.appendChild(li);
      else listaCasa.appendChild(li);
    }

    function guardarEstado() {
      const items = [];
      document.querySelectorAll("ul li").forEach(li => {
        const categoria = li.parentElement.id === "listaGVO" ? "GVO" : "Casa";
        items.push({
          texto: li.querySelector("span").textContent,
          marcado: li.querySelector("input").checked,
          categoria: categoria
        });
      });
      localStorage.setItem("miLista", JSON.stringify(items));
      actualizarContador();
    }

    function cargarEstado() {
      const items = JSON.parse(localStorage.getItem("miLista") || "[]");
      listaGVO.innerHTML = "";
      listaCasa.innerHTML = "";
      if (items.length === 0) {
        productosFijos.forEach(item => crearItem(item.texto, item.categoria));
      } else {
        items.forEach(item => crearItem(item.texto, item.categoria, item.marcado));
      }
      actualizarContador();
    }

    function agregarProducto() {
      const texto = document.getElementById("nuevoProducto").value.trim();
      const categoria = document.getElementById("categoria").value;
      if (texto) {
        crearItem(texto, categoria);
        document.getElementById("nuevoProducto").value = "";
        guardarEstado();
      }
    }

    function limpiarLista() {
      localStorage.removeItem("miLista");
      listaGVO.innerHTML = "";
      listaCasa.innerHTML = "";
      productosFijos.forEach(item => crearItem(item.texto, item.categoria));
      guardarEstado();
    }

    function actualizarContador() {
      const total = document.querySelectorAll("input[type=checkbox]").length;
      const marcados = document.querySelectorAll("input[type=checkbox]:checked").length;
      const pendientes = total - marcados;
      contador.textContent = `Pendientes: ${pendientes} / ${total}`;
      contador.style.color = pendientes === 0 ? "#2e7d32" : "#d32f2f";
    }

    document.getElementById("btnAgregar").onclick = agregarProducto;
    document.getElementById("btnLimpiar").onclick = limpiarLista;

    toggleBtn.onclick = () => {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
      const esDark = document.body.classList.contains("dark");
      toggleBtn.textContent = esDark ? "🌞 Tema Claro" : "🌙 Tema Oscuro";
      localStorage.setItem("temaLista", esDark ? "dark" : "light");
    };

    const temaGuardado = localStorage.getItem("temaLista");
    if (temaGuardado) {
      document.body.classList.remove("light","dark");
      document.body.classList.add(temaGuardado);
      toggleBtn.textContent = temaGuardado === "dark" ? "🌞 Tema Claro" : "🌙 Tema Oscuro";
    }

    cargarEstado();
  </script>
</body>
</html>
